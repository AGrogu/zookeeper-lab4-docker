x-zookeeper: &zookeeper
  image: zookeeper:3.9.6-jre-17

x-zookeeper-env: &zookeeper-env
  ZOO_TICK_TIME: "2000"
  ZOO_ADMINSERVER_ENABLED: "false"
  ZOO_4LW_COMMANDS_WHITELIST: "srvr"
  ZOO_SERVERS: "server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181"

services:
  zk1:
    <<: *zookeeper
    environment:
      <<: *zookeeper-env
      ZOO_MY_ID: "1"
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zk1-data:/data
      - zk1-datalog:/datalog

  zk2:
    <<: *zookeeper
    environment:
      <<: *zookeeper-env
      ZOO_MY_ID: "2"
    ports:
      - "127.0.0.1:2182:2181"
    volumes:
      - zk2-data:/data
      - zk2-datalog:/datalog

  zk3:
    <<: *zookeeper
    environment:
      <<: *zookeeper-env
      ZOO_MY_ID: "3"
    ports:
      - "127.0.0.1:2183:2181"
    volumes:
      - zk3-data:/data
      - zk3-datalog:/datalog

volumes:
  zk1-data:
  zk1-datalog:
  zk2-data:
  zk2-datalog:
  zk3-data:
  zk3-datalog:
